name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REGISTRY: 'docker.io'
      IMAGE: 'pedromsilvapt/unicast'
      FORCE_COLOR: 1
    steps:
      - uses: earthly/actions/setup-earthly@v1
        with:
          version: v0.8.16

      - uses: actions/checkout@v4

      - name: Compute version
        run: |
          # Tag pushes take the version from the tag (v1.2.3 -> 1.2.3);
          # manual dispatches fall back to the VERSION file.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(tr -d '[:space:]' < VERSION)
          fi
          echo "Detected version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run build
        run: |
          # unicast-interface is pinned to the same vX.Y.Z tag as this release
          earthly --push \
              --ci +docker \
              --REGISTRY "$REGISTRY" \
              --IMAGE "$IMAGE" \
              --TAG "$VERSION" \
              --INTERFACE_TAG "v$VERSION" \
              --INSECURE 0
